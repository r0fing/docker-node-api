version: '3.8'

services:
    proxy:
      image: nginx:latest
      ports:
        - 80:80
      volumes:
        - ./nginx.conf:/etc/nginx/nginx.conf

    api:
      build: .
      environment:
        - DB_HOST=database
        - DB_USER=root
        - DB_PASS=supersecret
        - DB_NAME=app_db
        - REDIS_HOST=cache
      depends_on: 
        - database
        - cache

    database:
      image: mariadb:10.11
      environment:
        - MARIADB_ROOT_PASSWORD=supersecret
        - MARIADB_DATABASE=app_db
      volumes:
        - db-data:/var/lib/mysql
    
    cache:
      image: redis:7-alpine

volumes:
    db-data:


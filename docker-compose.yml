version: '3.8'

services:
    api:
        build: .
        ports:
            - "3000:3000"
        environment:
            - DB_HOST=database
            - DB_USER=root
            - DB_PASS=supersecret
            - DB_NAME=app_db
        depends_on: 
            - database

    database:
        image: mariadb:10.11
        environment:
            - MARIADB_ROOT_PASSWORD=supersecret
            - MARIADB_DATABASE=app_db
        volumes:
            - db-data:/var/lib/mysql

volumes:
    db-data:

